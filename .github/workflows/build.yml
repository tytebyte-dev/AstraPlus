name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['nb4a.properties']

env:
  GO_VERSION: '1.27.1'

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build or restore libcore
        uses: ./.github/actions/libcore
        with:
          go-version: ${{ env.GO_VERSION }}

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore libcore
        uses: ./.github/actions/libcore
        with:
          go-version: ${{ env.GO_VERSION }}
          restore-only: 'true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Gradle build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ github.token }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleOssRelease --no-daemon --stacktrace

      - name: Upload APKs (one artifact per ABI)
        uses: ./.github/actions/upload-apks
        with:
          name-prefix: Astra
