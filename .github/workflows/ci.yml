name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GO_VERSION: '1.27.1'

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Compute libcore cache key
        id: key
        run: |
          golang_status=$(find buildScript libcore/*.sh -type f | sort | xargs cat | sha1sum | cut -d' ' -f1)
          libcore_status=$(git ls-files libcore | sort | xargs cat | sha1sum | cut -d' ' -f1)
          echo "golang_status=$golang_status" >> "$GITHUB_OUTPUT"
          echo "libcore_status=$libcore_status" >> "$GITHUB_OUTPUT"
          echo "$golang_status" > golang_status
          echo "$libcore_status" > libcore_status

      - name: LibCore cache
        id: cache
        uses: actions/cache@v5
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*') }}-${{ steps.key.outputs.golang_status }}-${{ steps.key.outputs.libcore_status }}

      - name: Install Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # в корне нет go.mod, кэш setup-go всё равно не находит зависимости

      - name: Install Rust (Android targets)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      # libcronet.a (sagernet/cronet-go) нельзя слинковать lld из NDK 27.3:
      # "unknown relocation (315)". Upstream проверяет Android-линковку на NDK r28.
      - name: Setup Android NDK r28
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          add-to-path: false

      - name: Use NDK r28 for libcore
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "NDK=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          grep Pkg.Revision "${{ steps.ndk.outputs.ndk-path }}/source.properties"

      - name: Native build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Compute libcore cache key
        id: key
        run: |
          golang_status=$(find buildScript libcore/*.sh -type f | sort | xargs cat | sha1sum | cut -d' ' -f1)
          libcore_status=$(git ls-files libcore | sort | xargs cat | sha1sum | cut -d' ' -f1)
          echo "golang_status=$golang_status" >> "$GITHUB_OUTPUT"
          echo "libcore_status=$libcore_status" >> "$GITHUB_OUTPUT"
          echo "$golang_status" > golang_status
          echo "$libcore_status" > libcore_status

      - name: Restore libcore
        uses: actions/cache/restore@v5
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*') }}-${{ steps.key.outputs.golang_status }}-${{ steps.key.outputs.libcore_status }}
          fail-on-cache-miss: true

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-oss-

      - name: Gradle build
        env:
          BUILD_PLUGIN: none
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleOssDebug --no-daemon --stacktrace

      - name: Sort APKs by ABI
        run: |
          mkdir -p apk-out/{arm64-v8a,armeabi-v7a,x86_64,x86,universal}
          find app/build/outputs/apk -name '*.apk' | while read -r f; do
            case "$f" in
              *arm64-v8a*)   abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*)      abi=x86_64 ;;
              *x86*)         abi=x86 ;;
              *universal*)   abi=universal ;;
              *) echo "skip: $f"; continue ;;
            esac
            cp -v "$f" "apk-out/$abi/"
          done
          ls -lhR apk-out

      # APK уже сжаты, поэтому compression-level: 0 (быстрее и размер тот же).
      - name: Upload APK arm64-v8a
        uses: actions/upload-artifact@v5
        with:
          name: APK-arm64-v8a
          path: apk-out/arm64-v8a/*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload APK armeabi-v7a
        uses: actions/upload-artifact@v5
        with:
          name: APK-armeabi-v7a
          path: apk-out/armeabi-v7a/*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload APK x86_64
        uses: actions/upload-artifact@v5
        with:
          name: APK-x86_64
          path: apk-out/x86_64/*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload APK x86
        uses: actions/upload-artifact@v5
        with:
          name: APK-x86
          path: apk-out/x86/*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload APK universal
        uses: actions/upload-artifact@v5
        with:
          name: APK-universal
          path: apk-out/universal/*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
