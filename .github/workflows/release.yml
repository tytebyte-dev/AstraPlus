name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Publish: If want ignore"
        required: false

env:
  GO_VERSION: '1.27.1'

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build or restore libcore
        uses: ./.github/actions/libcore
        with:
          go-version: ${{ env.GO_VERSION }}

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore libcore
        uses: ./.github/actions/libcore
        with:
          go-version: ${{ env.GO_VERSION }}
          restore-only: 'true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Gradle build
        env:
          BUILD_PLUGIN: none
          GITHUB_TOKEN: ${{ github.token }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleOssRelease --no-daemon --stacktrace

      - name: Upload APKs (one artifact per ABI)
        uses: ./.github/actions/upload-apks
        with:
          name-prefix: APKs

  publish:
    name: Publish Release
    if: github.event.inputs.publish != 'y'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download APK artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: APKs-*
          merge-multiple: true
          path: artifacts

      - name: Release
        run: |
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.13.0/ghr_v0.13.0_linux_amd64.tar.gz
          tar -xvf ghr.tar.gz
          mv ghr*linux_amd64/ghr .
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          ./ghr -delete -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" apks
